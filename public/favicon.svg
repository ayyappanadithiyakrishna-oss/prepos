<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- PrepOS owl — geometric, front-facing, Pitch signal violet.
       Solid fills only so the silhouette reads at 16px. -->
  <!-- Ear tufts -->
  <path d="M5.5 12 L10 3 L14.5 12.5 Z" fill="#6b53ff"/>
  <path d="M26.5 12 L22 3 L17.5 12.5 Z" fill="#6b53ff"/>
  <!-- Head + body: one rounded shield -->
  <path d="M16 5.5 C24 5.5 27.5 11.5 27.5 18 C27.5 25 22.2 29.5 16 29.5 C9.8 29.5 4.5 25 4.5 18 C4.5 11.5 8 5.5 16 5.5 Z" fill="#6b53ff"/>
  <!-- Wing hints (deep indigo, disappear cleanly at 16px) -->
  <path d="M6.5 19.5 C5.8 23 6.8 26.4 9 28 C8.1 24.4 8.2 21.6 8.9 18.6 Z" fill="#371789"/>
  <path d="M25.5 19.5 C26.2 23 25.2 26.4 23 28 C23.9 24.4 23.8 21.6 23.1 18.6 Z" fill="#371789"/>
  <!-- Eye discs -->
  <circle cx="11.6" cy="16" r="4.3" fill="#ffffff"/>
  <circle cx="20.4" cy="16" r="4.3" fill="#ffffff"/>
  <!-- Pupils -->
  <circle cx="12.3" cy="16.4" r="2" fill="#371789"/>
  <circle cx="19.7" cy="16.4" r="2" fill="#371789"/>
  <!-- Beak -->
  <path d="M16 19 L18.1 21.6 L16 24 L13.9 21.6 Z" fill="#371789"/>
</svg>
